<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal Nutrition Analyzer</title>
  <!-- Adding Marked.js to convert Markdown to HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f8f9fa;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    .stats {
      text-align: center;
      color: #6c757d;
      margin-bottom: 20px;
    }
    .form-container {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 30px;
      text-align: center;
    }
    input[type="text"] {
      padding: 12px;
      width: 65%;
      margin-right: 10px;
      border: 1px solid #ced4da;
      border-radius: 5px;
      font-size: 16px;
    }
    button {
      padding: 12px 24px;
      background-color: #198754;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #157347;
    }
    .fact-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 20px;
      border-left: 5px solid #198754;
    }
    .fact-card h3 {
      margin-top: 0;
      color: #198754;
      text-transform: capitalize;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }

    /* Styles to make the AI's markdown tables look good */
    .ai-content table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 15px;
    }
    .ai-content th, .ai-content td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    .ai-content th {
      background-color: #f2f2f2;
    }

    .meta-info {
      font-size: 0.85em;
      color: #adb5bd;
      text-align: right;
      margin-top: 15px;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }
    .empty-state {
      text-align: center;
      color: #6c757d;
      padding: 40px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>

<h1>🥗 Meal Nutrition Analyzer</h1>

<div class="stats">
  <p>Total meals analyzed: <strong th:text="${factCount}">0</strong></p>
</div>

<!-- The Input Form -->
<div class="form-container">
  <form th:action="@{/generate}" method="post">
    <input type="text" name="foodName" placeholder="What did you eat? (e.g., 1 moong dal chila)" required>
    <button type="submit">Analyze Meal</button>
  </form>
</div>

<h2>Your Food Diary</h2>

<!-- Empty State -->
<div th:if="${facts == null or facts.isEmpty()}" class="empty-state">
  <p>No meals analyzed yet. Enter a food above to get your first nutrition breakdown!</p>
</div>

<!-- The list of previously generated nutrition facts -->
<div th:each="fact : ${facts}" class="fact-card">
  <h3 th:text="${fact.foodName}">Food Name</h3>

  <!-- We store the raw AI response in a data attribute and let JS parse it -->
  <div class="ai-content" th:attr="data-raw-content=${fact.nutritionDetails}"></div>

  <div class="meta-info">
    Generated on: <span th:text="${#temporals.format(fact.createdAt, 'dd-MMM-yyyy HH:mm')}">Date</span> |
    Source: <span th:text="${fact.sourceApi}">API</span>
  </div>
</div>

<!-- Script to convert the Markdown into clean HTML on page load -->
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const aiContentDivs = document.querySelectorAll('.ai-content');
    aiContentDivs.forEach(div => {
      const rawContent = div.getAttribute('data-raw-content');
      if (rawContent) {
        div.innerHTML = marked.parse(rawContent);
      }
    });
  });
</script>

</body>
</html>
