# Server
server.port=8080

# H2 In-Memory DB
spring.datasource.url=jdbc:h2:mem:factsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false

# API Keys - set these as env vars or replace directly
deepseek.api.key=${DEEPSEEK_API_KEY}
deepseek.api.url=https://api.deepseek.com/chat/completions

# Rate Limiter
ratelimit.max-hits=20
ratelimit.window-minutes=60
ratelimit.ban-minutes=360
